name: Build HR Portal
on:
  push:
    branches: [ main, feature/monthly-performance-1405 ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/HRPortal/HRPortal.csproj
      - name: Build
        run: dotnet build src/HRPortal/HRPortal.csproj --configuration Release --no-restore
      - name: Verify embedded Git build identity
        shell: pwsh
        run: |
          $buildInfoPath = Join-Path $PWD "src/HRPortal/obj/Release/net8.0/GitBuildInfo.g.cs"
          $buildInfo = Get-Content -Raw $buildInfoPath
          $expected = $env:GITHUB_SHA.Substring(0, 12)
          if (-not $buildInfo.Contains($expected)) {
            throw "Generated build identity does not identify Git commit '$expected'."
          }
          Write-Host "Verified HR Portal build identity: $expected"
      - name: Verify evaluator hierarchical scope regression
        run: dotnet run --project tests/HRPortal.ScopeSmoke/HRPortal.ScopeSmoke.csproj --configuration Release
      - name: Verify workflow assignment and authorization regressions
        run: dotnet run --project tests/HRPortal.WorkflowSmoke/HRPortal.WorkflowSmoke.csproj --configuration Release
      - name: Verify Persian calendar conversion
        run: |
          node --check src/HRPortal/wwwroot/js/jalali-datepicker.js
          node scripts/test-jalali-datepicker.cjs