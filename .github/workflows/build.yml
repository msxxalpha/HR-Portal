name: Build HR Portal
on:
  push:
    branches: [ main, feature/performance-workflow-parity ]
  pull_request:
    branches: [ main, draft/workflow-foundation ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/HRPortal/HRPortal.csproj
      - name: Build
        run: dotnet build src/HRPortal/HRPortal.csproj --configuration Release --no-restore
      - name: Restore performance integration tests
        run: dotnet restore tests/HRPortal.Performance.Tests/HRPortal.Performance.Tests.csproj
      - name: Test performance integration
        run: dotnet test tests/HRPortal.Performance.Tests/HRPortal.Performance.Tests.csproj --configuration Release --no-restore
