name: Build HR Portal
on:
  push:
    branches: [ main, feature/monthly-performance-1405 ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/HRPortal/HRPortal.csproj
      - name: Build
        run: dotnet build src/HRPortal/HRPortal.csproj --configuration Release --no-restore
      - name: Verify embedded Git build identity
        shell: pwsh
        run: |
          $assemblyInfoPath = Join-Path $PWD "src/HRPortal/obj/Release/net8.0/HRPortal.AssemblyInfo.cs"
          $assemblyInfo = Get-Content -Raw $assemblyInfoPath
          $expected = $env:GITHUB_SHA.Substring(0, 12)
          if (-not $assemblyInfo.Contains($expected)) {
            throw "Generated assembly information does not identify Git commit '$expected'."
          }
          $versionLine = ($assemblyInfo -split "`r?`n" | Where-Object { $_ -match "AssemblyInformationalVersion" } | Select-Object -First 1)
          Write-Host "Verified HR Portal build identity: $versionLine"
      - name: Verify evaluator hierarchical scope regression
        run: dotnet run --project tests/HRPortal.ScopeSmoke/HRPortal.ScopeSmoke.csproj --configuration Release
      - name: Verify Persian calendar conversion
        run: |
          node --check src/HRPortal/wwwroot/js/jalali-datepicker.js
          node scripts/test-jalali-datepicker.cjs